ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot "/var/www/html/htdocs"
DirectoryIndex scielo.php index.php index.html

Alias /pdf/ "/var/www/html/bases/pdf/"

<Directory "/var/www/html/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <FilesMatch "^(?i:(phpinfo|info)\.php)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(?i:(readme(?:\..*)?|version(?:overview)?(?:\..*)?|.*\.(?:inc|def|template)(?:\.php)?))$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/bases/pdf/">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory "/var/www/html/cgi-bin">
    Options -Indexes +ExecCGI +FollowSymLinks
    AllowOverride None
    AddDefaultCharset ISO-8859-1
    Require all denied

    <Files "wxis.exe">
        Require all granted
    </Files>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http: https:"
</IfModule>
